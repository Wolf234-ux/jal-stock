name: Build Android APK + iPhone web app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish each version as a GitHub Release
  pages: write      # to publish the web app (iPhone version)
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder (first time only)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.wolftech --project-name jal_stock --platforms android .
            rm -f test/widget_test.dart
          fi
          # App name on the phone
          sed -i 's/android:label="jal_stock"/android:label="JalStock"/' android/app/src/main/AndroidManifest.xml
          bash tool/fix_android.sh

      - name: Create web folder (iPhone / browser version)
        run: |
          if [ ! -d web ]; then
            flutter create --org com.wolftech --project-name jal_stock --platforms web .
            rm -f test/widget_test.dart
          fi
          # name + colours shown when added to the iPhone home screen
          sed -i 's/jal_stock/JalStock/g; s/#0175C2/#0A3D62/g' web/manifest.json web/index.html
          sed -i 's/"description": "[^"]*"/"description": "Stock management for water bottle and jar suppliers"/' web/manifest.json

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Tests (Excel learning + stock rules)
        run: flutter test

      - name: Version number (Version 1, 2, 3 ...)
        run: echo "V=$(( ${{ github.run_number }} - 3 ))" >> $GITHUB_ENV

      # Same signing key for every version, so a new version installs
      # over the old one and the shop keeps its data.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.JALSTOCK_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed JalStock signing key"
          else
            echo "::warning::JALSTOCK_KEYSTORE secret not set - this APK cannot update older versions"
          fi

      - name: Build small APKs (one per phone type)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols \
            --build-name=1.$V.0 --build-number=$((V + 100)) --dart-define=APP_VERSION=$V
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk JalStock-v$V-arm64.apk
          mv app-armeabi-v7a-release.apk JalStock-v$V-armv7-old-phones.apk
          ls -lh *.apk

      - name: Build web app (iPhone version)
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=APP_VERSION=$V
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: JalStock-v${{ env.V }}-arm64 (most phones)
          path: build/app/outputs/flutter-apk/JalStock-v${{ env.V }}-arm64.apk
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: JalStock-v${{ env.V }}-armv7 (old phones)
          path: build/app/outputs/flutter-apk/JalStock-v${{ env.V }}-armv7-old-phones.apk
          compression-level: 0

      - name: Publish as GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: JalStock Version ${{ env.V }}
          body: |
            **Download `JalStock-v${{ env.V }}-arm64.apk`** (works on almost every phone).
            Use the armv7 file only on very old phones.

            **iPhone:** open https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ in Safari → Share → Add to Home Screen.

            Changes: ${{ github.event.head_commit.message }}
          files: |
            build/app/outputs/flutter-apk/JalStock-v${{ env.V }}-arm64.apk
            build/app/outputs/flutter-apk/JalStock-v${{ env.V }}-armv7-old-phones.apk

  # Publishes the iPhone / browser version to GitHub Pages
  deploy-web:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
